<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RS Gestão · Margem v5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7fa;--sf:#ffffff;--cd:#ffffff;--bd:#e2e8f0;--ac:#2b7cb3;--ac2:#005e83;--gn:#059669;--yl:#d97706;--rd:#dc2626;--tx:#1e293b;--mt:#64748b;--dm:#cbd5e1;--purple:#5b2c6f}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
input,select,button{font-family:inherit}
.hd{background:linear-gradient(135deg,#1e6fa5 0%,#2b7cb3 100%);border-bottom:none;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 8px rgba(30,111,165,.2)}
.hd-logo{height:110px;background:#fff;padding:10px 24px;border-radius:12px}
.hd h1{font-size:18px;font-weight:800;color:var(--ac2)}
.hd .sub{font-size:10px;color:var(--mt);letter-spacing:.1em}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hr select,.hr input[type=number]{padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:12px;outline:none}
.hr select option{background:#1e6fa5;color:#fff}
.nv{background:#fff;display:flex;gap:1px;padding:0 24px;border-bottom:2px solid #e2e8f0;overflow-x:auto}
.nv button{padding:11px 16px;font-size:11px;font-weight:500;color:var(--mt);background:0;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nv button.on{color:var(--ac2);border-bottom-color:var(--ac);font-weight:600}
.mn{padding:20px 24px;max-width:1280px;margin:0 auto}
.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}
.k{background:#fff;border-radius:12px;padding:18px 22px;border:1px solid var(--bd);position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.k::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.k.bl::before{background:linear-gradient(90deg,#2b7cb3,#5bb7e8)}.k.am::before{background:linear-gradient(90deg,#d97706,#dc2626)}.k.em::before{background:linear-gradient(90deg,#059669,#2b7cb3)}.k.rs::before{background:linear-gradient(90deg,#dc2626,#d97706)}
.kl{font-size:10px;color:var(--mt);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.kv{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.ks{font-size:11px;color:var(--mt);margin-top:4px}
.cc{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cc h3{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--tx)}
.bg{display:inline-block;padding:2px 9px;border-radius:16px;font-size:10px;font-weight:600}
.bg-gn{background:#d1fae5;color:#065f46}.bg-yl{background:#fef3c7;color:#92400e}.bg-rd{background:#fee2e2;color:#991b1b}.bg-bl{background:#dbeafe;color:#1e40af}.bg-gy{background:#f1f5f9;color:#64748b}
.cr{background:#fff;border-radius:10px;margin-bottom:6px;border:1px solid var(--bd);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.cr.op{border-color:var(--ac)}
.ch{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px;flex-wrap:wrap}
.ch:hover{background:#f8fafc}
.cn{font-weight:600;font-size:13px;color:var(--tx);flex:1;min-width:140px}
.cn small{font-weight:400;font-size:10px;color:var(--mt);display:block;margin-top:1px}
.cv{text-align:right;min-width:80px;font-variant-numeric:tabular-nums}
.cv label{font-size:9px;color:var(--mt);display:block}.cv .vl{font-size:13px;font-weight:600}
.ep{padding:4px 14px 14px;border-top:1px solid var(--bd);background:#f8fafc}
.ft{font-size:10px;font-weight:600;color:var(--mt);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.fs{display:flex;gap:8px;flex-wrap:wrap}
.fi{flex:1;min-width:100px}
.fi label{font-size:10px;color:var(--mt);display:block;margin-bottom:3px;font-weight:500}
.fw{display:flex;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.fw:focus-within{border-color:var(--ac)}
.fw .px{padding:0 6px;font-size:10px;color:var(--mt);background:#f8fafc;border-right:1px solid var(--bd);height:30px;display:flex;align-items:center}
.fw input,.fw select{width:100%;padding:5px 8px;border:none;background:0;color:var(--tx);font-size:12px;outline:none;font-variant-numeric:tabular-nums}
.sb{display:flex;gap:12px;padding:12px 14px;background:#f1f5f9;border-radius:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.si{font-size:11px;color:var(--mt)}.si b{color:var(--tx);font-weight:600}
.tb{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.tb input[type=text]{flex:1;min-width:180px;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:12px;outline:none}
.fb{padding:5px 14px;border-radius:16px;font-size:11px;font-weight:500;border:1px solid var(--bd);background:#fff;color:var(--mt);cursor:pointer}
.fb.on{border-color:var(--ac);background:#dbeafe;color:#1e40af}
.tw{background:#fff;border-radius:12px;border:1px solid var(--bd);overflow:auto;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--mt);letter-spacing:.05em;border-bottom:2px solid var(--bd);background:#f8fafc}
td{padding:9px 14px;border-bottom:1px solid #f1f5f9;font-size:12px}
th.r,td.r{text-align:right}
.rk{display:flex;flex-direction:column;gap:5px}
.ri{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:7px;background:#f8fafc;border:1px solid #e2e8f0}
.ri .nm{font-size:12px;font-weight:500;color:var(--tx)}.ri .su{font-size:10px;color:var(--mt)}
.btn{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid}
.btn-ac{border-color:rgba(43,124,179,.3);background:rgba(43,124,179,.08);color:#2b7cb3}
.btn-rd{border-color:rgba(220,38,38,.3);background:rgba(220,38,38,.06);color:#dc2626}
.btn-gn{border-color:rgba(5,150,105,.3);background:rgba(5,150,105,.08);color:#059669}
.btn-yl{border-color:rgba(217,119,6,.3);background:rgba(217,119,6,.08);color:#d97706}
.hd .btn{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff}
.hd .btn:hover{background:rgba(255,255,255,.25)}
.prof-block{background:#f8fafc;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--bd)}
.prof-block .prof-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prof-block .prof-nm{font-size:12px;font-weight:600;color:var(--ac2)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:24px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--tx)}
.modal .fi{min-width:100%;margin-bottom:10px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.rb{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:3px}
.rf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--gn))}
.import-box{background:#f8fafc;border:2px dashed var(--bd);border-radius:14px;padding:30px;text-align:center;margin-bottom:16px;cursor:pointer}
.import-box:hover{border-color:var(--ac)}
.import-log{background:#f8fafc;border:1px solid var(--bd);border-radius:8px;padding:14px;font-size:12px;color:var(--mt);max-height:300px;overflow-y:auto;white-space:pre-wrap}
.import-log .ok{color:#059669}.import-log .wr{color:#d97706}.import-log .er{color:#dc2626}
.footer{text-align:center;padding:24px;font-size:10px;color:var(--dm)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:600;margin-left:4px;background:rgba(43,124,179,.1);color:#2b7cb3}
.tag-gn{background:rgba(5,150,105,.1);color:#059669}
</style>
</head>

function matchClient(name){
  if(!name)return null;
  const n=name.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  // Direct alias match
  for(const[alias,canonical] of Object.entries(ALIASES)){
    const na=alias.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(n.includes(na)||na.includes(n)){
      const can=canonical.toLowerCase();
      return S.clients.find(c=>c.nome.toLowerCase()===can)||S.clients.find(c=>can.includes(c.nome.toLowerCase()))||null;
    }
  }
  // Fuzzy: direct substring
  return S.clients.find(c=>{const cn=c.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");return n.includes(cn)||cn.includes(n)})||null;
}

function parseMACC(wb){
  const log=[];let imported=0;const k=KY();if(!S.data[k])S.data[k]={};
  const sheets=wb.SheetNames.filter(s=>s.toLowerCase().includes("df")||s.toLowerCase().includes("ms")||s.toLowerCase().includes("mg"));
  if(!sheets.length){log.push({t:"er",m:"Nenhuma aba DF/MS encontrada. Verifique o arquivo."});return log}
  sheets.forEach(sn=>{
    const ws=wb.Sheets[sn];const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    // Find header row
    let hRow=-1;
    for(let i=0;i<Math.min(10,rows.length);i++){const r=(rows[i]||[]).map(c=>String(c||"").toLowerCase());if(r.some(c=>c.includes("professor"))&&r.some(c=>c.includes("cliente"))){hRow=i;break}}
    if(hRow<0){log.push({t:"wr",m:`Aba "${sn}": cabeçalho não encontrado`});return}
    const hdr=rows[hRow].map(c=>String(c||"").toLowerCase());
    const iProf=hdr.findIndex(h=>h.includes("professor"));
    const iCli=hdr.findIndex(h=>h.includes("cliente"));
    const iHA=hdr.findIndex(h=>h.includes("h. aula")||h.includes("h.aula")||(h.includes("hora")&&h.includes("aula")));
    const iHT=hdr.findIndex(h=>h.includes("h. téc")||h.includes("h.tec")||(h.includes("hora")&&h.includes("téc")));
    const iVHA=hdr.findIndex(h=>h.includes("valor ha")||h.includes("valor h"));
    const iVHT=hdr.findIndex(h=>(h.includes("valor ht")||h.includes("valor h"))&&hdr.indexOf(h)>iVHA);
    const iTotal=hdr.findIndex(h=>h.includes("total"));

    // Group by client
    const byClient={};
    for(let i=hRow+1;i<rows.length;i++){
      const r=rows[i];if(!r||!r[iProf]||!r[iCli])continue;
      const profNm=String(r[iProf]).trim();
      const cliNm=String(r[iCli]).trim();
      if(cliNm.toLowerCase().includes("total")||cliNm.toLowerCase().includes("subtotal"))continue;
      const cliLow=cliNm.toLowerCase();
      if(typeof SKIP_IMPORT!=="undefined"&&SKIP_IMPORT.some(sk=>cliLow.includes(sk)))continue;
      if(cliLow==="(fixo mensal)")continue;
      const match=matchClient(cliNm);
      if(!match){log.push({t:"wr",m:`"${cliNm}" (prof. ${profNm}) — cliente não encontrado na carteira`});continue}
      if(!byClient[match.id])byClient[match.id]={profs:{}};
      if(!byClient[match.id].profs[profNm])byClient[match.id].profs[profNm]={haQ:0,haV:0,htQ:0,htV:0,total:0};
      const p=byClient[match.id].profs[profNm];
      const ha=nn(r[iHA]);const ht=nn(r[iHT]);
      p.haQ+=ha;p.htQ+=ht;
      if(iVHA>=0&&r[iVHA])p.haV=nn(r[iVHA]);
      if(iVHT>=0&&r[iVHT])p.htV=nn(r[iVHT]);
      if(iTotal>=0)p.total+=nn(r[iTotal]);
    }
    // Apply to state
    for(const[cid,cd] of Object.entries(byClient)){
      if(!S.data[k][cid])S.data[k][cid]={royalties:0,profs:[]};
      S.data[k][cid].profs=Object.entries(cd.profs).map(([nm,d])=>({nm,haQ:d.haQ,haV:d.haV,htQ:d.htQ,htV:d.htV,ph:0,taxi:0,dAnl:0}));
      const cNm=S.clients.find(c=>c.id===cid)?.nome||cid;
      const nProfs=Object.keys(cd.profs).length;
      log.push({t:"ok",m:`${cNm}: ${nProfs} professor(es) importado(s)`});
      imported++;
    }
    log.push({t:"ok",m:`Aba "${sn}": ${imported} clientes processados`});
  });
  return log;
}

function parseBRNum(v){
  if(v==null||v==="")return 0;
  if(typeof v==="number")return Math.abs(v);
  let s=String(v).replace(/R\$/g,"").replace(/\s/g,"").trim();
  if(!s)return 0;
  const hasDot=s.includes("."),hasComma=s.includes(",");
  if(hasDot&&hasComma){
    // Both: determine which is decimal by position (last one wins)
    if(s.lastIndexOf(",")>s.lastIndexOf(".")){s=s.replace(/\./g,"").replace(",",".")} // BR: 43.000,00
    else{s=s.replace(/,/g,"")} // US: 43,000.00
  }else if(hasComma){
    // Only comma: if followed by exactly 3 digits at end → thousands (US), else decimal (BR)
    const afterComma=s.split(",").pop();
    if(afterComma.length===3&&s.split(",").length===2&&!/[^0-9]/.test(afterComma)){s=s.replace(",","")}
    else{s=s.replace(",",".")}
  }else if(hasDot){
    // Only dot: if followed by exactly 3 digits → thousands (BR), else decimal
    const parts=s.split(".");
    if(parts.length===2&&parts[1].length===3){s=s.replace(".","")}
    else if(parts.length>2){s=s.replace(/\./g,"")}
  }
  return Math.abs(parseFloat(s))||0;
}
function parseReceb(wb){

  b2bSheets.forEach(sn=>{

    const ws=wb.Sheets[sn];if(!ws){log.push({t:"wr",m:`Aba "${sn}": vazia`});return}
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    let found=0,hRow=-1,iEmp=-1,iMens=-1,iPag=-1;
    for(let i=0;i<Math.min(10,rows.length);i++){

      if(mens<10)continue;
      let paid=false;
      if(iPag>=0){const pv=r[iPag];if(pv!=null&&pv!==""){if(typeof pv==="number"&&pv>40000)paid=true;else if(pv instanceof Date)paid=true;else if(typeof pv==="string"&&pv.trim().length>0&&pv.trim()!=="0")paid=true}}
      if(!S.receb[k][match.id])S.receb[k][match.id]={ar:0,rc:0};
      S.receb[k][match.id].ar+=mens;if(paid)S.receb[k][match.id].rc+=mens;found++;
      log.push({t:"ok",m:`  ${match.nome}: ${fmt(mens)}${paid?" ✓":" ⏳"}`});
    }
    log.push({t:"ok",m:`Aba "${sn}": ${found} lançamentos`});
    }catch(err){log.push({t:"er",m:`Aba "${sn}": erro - ${err.message}`})}
  });
  const tAR=Object.values(S.receb[k]).reduce((s,r)=>s+nn(r.ar),0);

  return log;
}

    const r=rows[i];
    // Detect header row: col A contains "Professor" (case insensitive)
    if(r&&r[0]&&String(r[0]).trim().toLowerCase().replace(/\s/g,"").includes("professor")&&String(r[2]||"").toLowerCase().includes("companhia")){
      // Next row should have professor name
      i++;if(i>=rows.length)break;
      const profRow=rows[i];
      const profName=String(profRow[0]||"").trim();
      if(!profName||profName.toLowerCase().includes("professor")){i++;continue}
      // Collect flights until Roteiro
      let flights=[],hotelVal=0,hotelName="";
      // First row may have hotel too (cols P=15, Q=16)
      if(profRow[15])hotelName=String(profRow[15]).trim();
      if(profRow[16]&&typeof profRow[16]==="number")hotelVal+=profRow[16];
      // Flight on first row
      const status0=String(profRow[11]||"").trim().toUpperCase();
      if(profRow[13]&&typeof profRow[13]==="number"&&!status0.includes("CANCEL")){
        flights.push({val:profRow[13],status:status0});
      }
      i++;
      // Read more flight/hotel rows until Roteiro or next header
      while(i<rows.length){
        const fr=rows[i];
        if(!fr){i++;continue}
        const a=String(fr[0]||"").trim().toLowerCase();
        if(a.includes("roteiro"))break;
        if(a.includes("professor")&&String(fr[2]||"").toLowerCase().includes("companhia"))break;
        // Flight row?
        const fStatus=String(fr[11]||"").trim().toUpperCase();
        if(fr[13]&&typeof fr[13]==="number"&&!fStatus.includes("CANCEL")){
          flights.push({val:fr[13],status:fStatus});
        }
        // Hotel in this row?
        if(fr[15]&&!hotelName)hotelName=String(fr[15]).trim();
        if(fr[16]&&typeof fr[16]==="number")hotelVal+=fr[16];
        i++;
      }
      // Now read Roteiro - collect ALL companies in this trip
      let empresas=[];
      if(i<rows.length&&String(rows[i]?.[0]||"").toLowerCase().includes("roteiro")){
        i++; // skip roteiro header
        while(i<rows.length){
          const rr=rows[i];
          if(!rr){i++;break} // truly empty row = end of block
          const colA=String(rr[0]||"").trim();
          const colD=String(rr[3]||"").trim();
          // Next professor block?
          if(colA.toLowerCase().replace(/\s/g,"").includes("professor")&&String(rr[2]||"").toLowerCase().includes("companhia"))break;
          // All cells empty?
          const hasAny=rr.some(c=>c!=null&&String(c).trim()!=="");
          if(!hasAny){i++;break}
          // Extract companies from col D (may have newlines)
          if(colD&&colD.length>2){
            colD.split(/\n|\r/).map(l=>l.trim()).filter(l=>l.length>2).forEach(line=>{
              const empMatch=line.match(/^(.+?)\s*-\s*/);
              const empName=empMatch?empMatch[1].trim():line.split("-")[0].trim();
              const empLow=(empName||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
              if(empName&&!SKIP_IMPORT.some(sk=>empLow.includes(sk))&&!empLow.includes("viagem")&&!empLow.includes("rs gest")){
                const matched=matchClient(empName);
                if(matched&&!empresas.find(e=>e.id===matched.id)){
                  empresas.push({id:matched.id,nome:matched.nome});
                }else if(!matched){
                  log.push({t:"wr",m:`"${empName}" (roteiro ${profName}) — não encontrado`});
                }
              }
            });
          }
          i++;
        }
      }
      const totalPassagens=flights.reduce((s,f)=>s+f.val,0);
      const totalLog=totalPassagens+hotelVal;
      if(empresas.length>0&&totalLog>0){
        const nEmpresas=empresas.length;
        const perEmpresa=Math.round(totalLog/nEmpresas*100)/100;
        log.push({t:"ok",m:`${profName}: ${fmt(totalPassagens)} passagens${hotelVal?" + "+fmt(hotelVal)+" hotel":""} = ${fmt(totalLog)} ÷ ${nEmpresas} empresa${nEmpresas>1?"s":""} = ${fmt(perEmpresa)}/cada`});
        empresas.forEach(emp=>{
          if(!S.data[k][emp.id])S.data[k][emp.id]={royPct:30,impPct:5,profs:[]};
          // Find existing prof entry by first name match
          const profFirst=profName.split(" ")[0].toLowerCase();
          let pIdx=S.data[k][emp.id].profs.findIndex(p=>p.nm&&p.nm.toLowerCase().includes(profFirst));
          if(pIdx<0){pIdx=S.data[k][emp.id].profs.length;S.data[k][emp.id].profs.push({nm:profName,haQ:0,haV:0,htQ:0,htV:0,ph:0,taxi:0,dAnl:0})}
          const prevPh=nn(S.data[k][emp.id].profs[pIdx].ph);
          S.data[k][emp.id].profs[pIdx].ph=Math.round((prevPh+perEmpresa)*100)/100;
          log.push({t:"ok",m:`  → ${emp.nome}: ${prevPh>0?fmt(prevPh)+" + ":""}${fmt(perEmpresa)}${prevPh>0?" = "+fmt(prevPh+perEmpresa):""}`});
        });
        blocks.push({prof:profName,empresas:nEmpresas,total:totalLog});
      }else if(totalLog>0&&empresas.length===0){
        log.push({t:"wr",m:`${profName}: ${fmt(totalLog)} — sem empresa no roteiro (evento institucional)`});
      }
      continue;
    }
    i++;
  }
  log.push({t:"ok",m:`✓ ${blocks.length} blocos processados`});
  return log;
}

function handleImport(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const names=wb.SheetNames.map(s=>s.toLowerCase());
      let log=[],type="";
      // Detect file type - order matters!
      // Logistics: has "Modelo" + month-name tabs (Janeiro, Fevereiro...)
      // Recebimentos: has tabs starting with "B2B" (B2B- DF, B2B- MS, etc.)
      // MAAC: has "Resumo" tab (executive summary of professor hours)
      const hasModelo=names.some(s=>s==="modelo"||s==="calculos");
      const hasMonths=names.filter(s=>["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"].some(m=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(m))).length>=3;
      const hasB2B=names.some(s=>s.includes("b2b"));
      const hasResumo=names.some(s=>s==="resumo");

      if(hasModelo&&hasMonths){
        type="LOG";log.push({t:"ok",m:"✈ Tipo detectado: Planilha de Logística de Professores"});
        log=log.concat(parseLogistica(wb));
      }else if(hasB2B){
        type="RECEB";log.push({t:"ok",m:"💰 Tipo detectado: Planilha de Recebimentos"});
        log=log.concat(parseReceb(wb));
      }else if(hasResumo){
        type="MAAC";log.push({t:"ok",m:"📋 Tipo detectado: Relatório de Horas MAAC"});
        log=log.concat(parseMACC(wb));
      }else{
        type="AUTO";log.push({t:"wr",m:"Tipo não identificado. Tentando detecção automática..."});
        const maacLog=parseMACC(wb);
        if(maacLog.filter(l=>l.t==="ok").length>1)log=log.concat(maacLog);
        else{const logLog=parseLogistica(wb);if(logLog.filter(l=>l.t==="ok").length>1)log=log.concat(logLog);else log=log.concat(parseReceb(wb))}
      }
      S.importLog=log;save();render();
    }catch(err){S.importLog=[{t:"er",m:"Erro ao processar: "+err.message}];render()}
  };
  reader.readAsArrayBuffer(file);
}

function rRecb(el){const rk=KY(),rb=S.receb[rk]||{};const tAR=S.clients.reduce((s,c)=>s+nn(rb[c.id]?.ar),0);const tRc=S.clients.reduce((s,c)=>s+nn(rb[c.id]?.rc),0);const pct=tAR>0?tRc/tAR:0;
el.innerHTML=`<div class="g g3" style="margin-bottom:16px"><div class="k bl"><div class="kl">A Receber — ${MS_S[S.mes]}/${S.ano}</div><div class="kv" style="color:#60a5fa">${fmt(tAR)}</div><div class="ks">Importe via aba ⬆ ou preencha abaixo</div></div><div class="k em"><div class="kl">Recebido</div><div class="kv" style="color:#34d399">${fmt(tRc)}</div><div class="rb"><div class="rf" style="width:${(pct*100).toFixed(0)}%"></div></div><div class="ks">${(pct*100).toFixed(1)}%</div></div><div class="k rs"><div class="kl">Pendente</div><div class="kv" style="color:#f87171">${fmt(tAR-tRc)}</div><div class="ks">${S.clients.filter(c=>rb[c.id]&&nn(rb[c.id].ar)>nn(rb[c.id].rc)).length} clientes</div></div></div>
<div class="tw"><table><thead><tr><th>#</th><th>Cliente</th><th>Reg.</th><th class="r">A Receber</th><th class="r">Recebido</th><th>Status</th></tr></thead><tbody>${S.clients.sort((a,b)=>a.nome.localeCompare(b.nome)).map((c,i)=>{const r=rb[c.id]||{};const ar=nn(r.ar),rc=nn(r.rc);const st=ar===0?"—":rc>=ar?bg("✓ Pago","gn"):rc>0?bg("Parcial","yl"):bg("Pendente","rd");return`<tr><td style="color:var(--mt)">${i+1}</td><td style="font-weight:500;color:#1e293b">${c.nome}</td><td>${bg(c.reg,"bl")}</td><td class="r"><div class="fw" style="max-width:120px;margin-left:auto"><span class="px">R$</span><input type="number" value="${ar||''}" data-rc="${c.id}" data-rf="ar" style="text-align:right" placeholder="0"></div></td><td class="r"><div class="fw" style="max-width:120px;margin-left:auto"><span class="px">R$</span><input type="number" value="${rc||''}" data-rc="${c.id}" data-rf="rc" style="text-align:right" placeholder="0"></div></td><td>${st}</td></tr>`}).join("")}</tbody></table></div>`;
document.querySelectorAll("[data-rc]").forEach(inp=>inp.addEventListener("change",()=>{const rk2=KY();if(!S.receb[rk2])S.receb[rk2]={};if(!S.receb[rk2][inp.dataset.rc])S.receb[rk2][inp.dataset.rc]={ar:0,rc:0};S.receb[rk2][inp.dataset.rc][inp.dataset.rf]=nn(inp.value);save();render()}))}

function rAnlt(el){const anls=Object.keys(S.analistas);el.innerHTML=`<div class="cc" style="margin-bottom:16px"><h3>Custo Mensal dos Analistas</h3><div style="font-size:11px;color:var(--mt);margin-bottom:14px">Informe o salário e a quantidade de empresas acompanhadas. O custo por cliente = salário ÷ nº empresas.</div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">${anls.map(a=>{const autoCnt=S.clients.filter(c=>c.anl===a).length;const manualQty=S.analistas[a]?.qty||0;const usedQty=manualQty||autoCnt;return`<div style="background:var(--sf);border-radius:10px;padding:14px;border:1px solid var(--bd)"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-weight:600;color:#1e293b;font-size:14px">${a}</span><button class="btn btn-rd" style="padding:2px 8px;font-size:9px" data-rmanl="${a}">✕</button></div><div class="fs" style="gap:8px;margin-bottom:8px"><div class="fi"><label>Salário Mensal</label><div class="fw"><span class="px">R$</span><input type="number" value="${nn(S.analistas[a]?.sal)||''}" data-anl="${a}" data-af="sal" placeholder="0"></div></div><div class="fi" style="max-width:120px"><label>Nº Empresas</label><div class="fw"><input type="number" value="${manualQty||''}" data-anl="${a}" data-af="qty" placeholder="${autoCnt}" style="text-align:center" title="Auto: ${autoCnt} empresas na carteira"></div></div></div><div style="font-size:11px;color:var(--mt)">Custo/cliente: <b style="color:#60a5fa">${fmt(anlCost(a))}</b><span style="margin-left:8px;color:var(--dm)">(${usedQty} empresas${!manualQty?" · auto":""})${autoCnt!==usedQty?" · carteira: "+autoCnt:""}</span></div></div>`}).join("")}</div><button class="btn btn-ac" id="addAnl" style="margin-top:12px">＋ Novo Analista</button></div>`;
document.querySelectorAll("[data-anl]").forEach(inp=>inp.addEventListener("change",()=>{const a=inp.dataset.anl;const f=inp.dataset.af;if(!S.analistas[a])S.analistas[a]={sal:0,qty:0};if(f==="sal")S.analistas[a].sal=nn(inp.value);else if(f==="qty")S.analistas[a].qty=parseInt(inp.value)||0;save();render()}));
document.querySelectorAll("[data-rmanl]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Remover analista "+b.dataset.rmanl+"?")){delete S.analistas[b.dataset.rmanl];save();render()}}));
document.getElementById("addAnl").addEventListener("click",()=>{const nm=prompt("Nome:");if(nm){S.analistas[nm]={sal:0,qty:0};save();render()}})}

function rImp(el){
  el.innerHTML=`<div class="cc" style="margin-bottom:16px"><h3>⬆ Importação Inteligente</h3>
  <div style="font-size:12px;color:var(--mt);margin-bottom:16px;line-height:1.6">O sistema detecta automaticamente o tipo de planilha e preenche os dados corretos:<br>
  <b style="color:#93c5fd">📋 Relatório MAAC (.xlsx)</b> → Horas e valores de professores por empresa<br>
  <b style="color:#fcd34d">✈ Logística de Professores (.xlsx)</b> → Passagens, hotéis e traslados por empresa<br>
  <b style="color:#6ee7b7">💰 Recebimentos (.xlsx)</b> → Valores a receber e recebidos por cliente<br>
  Dados importados vão para o mês selecionado: <b style="color:#1e293b">${MS[S.mes]} ${S.ano}</b></div>
  <div class="import-box" id="dropZone"><input type="file" id="impFile" accept=".xlsx,.xls" style="display:none">
  <div style="font-size:36px;margin-bottom:8px">📂</div>
  <div style="font-size:14px;font-weight:600;color:#1e293b;margin-bottom:4px">Arraste ou clique para selecionar</div>
  <div style="font-size:12px;color:var(--mt)">Aceita .xlsx e .xls</div></div></div>
  ${S.importLog.length?`<div class="cc"><h3>Resultado da Última Importação</h3><div class="import-log">${S.importLog.map(l=>`<div class="${l.t}">${l.t==="ok"?"✓":l.t==="wr"?"⚠":"✕"} ${l.m}</div>`).join("")}</div></div>`:''}`;
  const dz=document.getElementById("dropZone"),fi=document.getElementById("impFile");
  dz.addEventListener("click",()=>fi.click());
  fi.addEventListener("change",e=>{if(e.target.files[0])handleImport(e.target.files[0])});
  dz.addEventListener("dragover",e=>{e.preventDefault();dz.style.borderColor="var(--ac)"});
  dz.addEventListener("dragleave",()=>dz.style.borderColor="var(--bd)");
  dz.addEventListener("drop",e=>{e.preventDefault();dz.style.borderColor="var(--bd)";if(e.dataTransfer.files[0])handleImport(e.dataTransfer.files[0])});
}

// Backup
function backup(){const o={clients:S.clients,data:S.data,analistas:S.analistas,receb:S.receb};const b=new Blob([JSON.stringify(o,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`rs_margem_backup_${new Date().toISOString().slice(0,10)}.json`;a.click()}

// Init
(async function(){const sel=document.getElementById("sM");MS_S.forEach((m,i)=>{const o=document.createElement("option");o.value=i;o.textContent=m;if(i===7)o.selected=true;sel.appendChild(o)});
sel.addEventListener("change",()=>{S.mes=+sel.value;render()});document.getElementById("sA").addEventListener("change",e=>{S.ano=+e.target.value;render()});
document.querySelectorAll(".nv button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nv button").forEach(x=>x.classList.remove("on"));b.classList.add("on");S.tab=b.dataset.t;S.eid=null;render()}));
document.getElementById("bkp").addEventListener("click",backup);
document.getElementById("fbCfg").addEventListener("click",showFbConfig);
document.getElementById("syncSt").addEventListener("click",showFbConfig);
await load();initFirebase();render()})();
</script>
</body>
</html>
